<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline — Steady</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0E1512;
      color: #DFE4E0;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .icon {
      width: 80px; height: 80px;
      border-radius: 20px;
      background: #1E5033;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
    }
    .icon span {
      font-size: 2rem;
      color: #6ED69E;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.95rem;
      color: #889390;
      max-width: 320px;
      line-height: 1.5;
    }
    .hint {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #5F6A65;
    }
  </style>
</head>
<body>
  <div class="icon"><span>✦</span></div>
  <h1>You're offline</h1>
  <p>Your data is safe — it's stored on this device. Reconnect to load the full app.</p>
  <p class="hint">Steady works offline once cached</p>
</body>
</html>
